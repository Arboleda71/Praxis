# Instancia efímera exclusiva de integración. Nunca reutiliza el volumen de desarrollo.
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: praxis_test
      POSTGRES_PASSWORD: praxis_test
      POSTGRES_DB: praxis_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxis_test -d praxis_test"]
      interval: 2s
      timeout: 3s
      retries: 30
